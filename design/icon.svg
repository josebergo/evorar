<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Evorar (Ai-Ya-Ya, 艾呀压) app icon — "E·Press": letter E whose middle arm is an arrow pressing in -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C97FF"/>
      <stop offset="0.52" stop-color="#4C6EF5"/>
      <stop offset="1" stop-color="#364FC7"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEFF"/>
    </linearGradient>
    <radialGradient id="depth" cx="0.78" cy="0.84" r="0.9">
      <stop offset="0" stop-color="#1A2B6B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1A2B6B" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1A2B6B" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#depth)"/>
  </g>
  <rect x="12" y="12" width="1000" height="1000" rx="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>

  <g filter="url(#lift)" fill="url(#glyph)">
    <rect x="262" y="248" width="124" height="528" rx="62"/>
    <rect x="262" y="248" width="500" height="124" rx="62"/>
    <rect x="262" y="652" width="500" height="124" rx="62"/>
    <rect x="552" y="450" width="210" height="124" rx="62"/>
    <path d="M428 512 L592 400 L592 624 Z" stroke="url(#glyph)" stroke-width="20" stroke-linejoin="round"/>
  </g>
</svg>
